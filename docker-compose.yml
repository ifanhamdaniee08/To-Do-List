services:
  # 1. Database Service: PostgreSQL 15 Alpine (Lightweight)
  db:
    image: postgres:15-alpine
    container_name: taskmaster_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: todolist_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Port 5434 di laptop (pgAdmin) -> Port 5432 di dalam container
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d todolist_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Web Application Service: Flask API + Frontend Static UI
  web:
    build: .
    container_name: taskmaster_webapp
    restart: always
    ports:
      # Port 5000 di laptop Anda -> Port 5000 di container (sesuai Google OAuth Authorized Origins)
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/todolist_db
      SECRET_KEY: taskmaster_secret_key_production_12345
      JWT_SECRET_KEY: taskmaster_jwt_secret_key_production_67890
      GOOGLE_CLIENT_ID: 740584970640-kr0kd1lgsio5kj9f5t0m7brat43n12v7.apps.googleusercontent.com
    volumes:
      - ./frontend:/app/frontend
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
