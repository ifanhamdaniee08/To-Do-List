<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="card-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="blue-btn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="soft-shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>
    <filter id="badge-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Glow Background Circles -->
  <circle cx="270" cy="200" r="180" fill="url(#bg-glow)" />
  <circle cx="440" cy="90" r="70" fill="#E0E7FF" opacity="0.5"/>
  <circle cx="90" cy="310" r="60" fill="#FEF3C7" opacity="0.4"/>

  <!-- ================= MAIN DASHBOARD PREVIEW CARD ================= -->
  <g filter="url(#soft-shadow)">
    <rect x="90" y="60" width="360" height="260" rx="20" fill="url(#card-grad1)" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Top Mock Window Bar -->
    <rect x="90" y="60" width="360" height="40" rx="20" fill="#F1F5F9"/>
    <rect x="90" y="80" width="360" height="20" fill="#F1F5F9"/>
    <!-- Window Dots -->
    <circle cx="115" cy="80" r="5" fill="#EF4444"/>
    <circle cx="130" cy="80" r="5" fill="#F59E0B"/>
    <circle cx="145" cy="80" r="5" fill="#10B981"/>
    
    <!-- Mock Search Bar inside window -->
    <rect x="180" y="71" width="160" height="18" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="192" cy="80" r="3.5" stroke="#94A3B8" stroke-width="1.2"/>
    
    <!-- Card Content Area -->
    <!-- Task Row 1 (Done) -->
    <rect x="120" y="120" width="300" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="142" cy="141" r="10" fill="url(#green-grad)"/>
    <path d="M138 141 L141 144 L147 138" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="165" y="134" width="120" height="7" rx="3.5" fill="#94A3B8"/>
    <rect x="165" y="145" width="70" height="5" rx="2.5" fill="#CBD5E1"/>
    <!-- Badge -->
    <rect x="345" y="132" width="60" height="18" rx="9" fill="#ECFDF5"/>
    <text x="375" y="145" font-family="sans-serif" font-size="9" font-weight="bold" fill="#047857" text-anchor="middle">DONE</text>

    <!-- Task Row 2 (In Progress) -->
    <rect x="120" y="174" width="300" height="42" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="142" cy="195" r="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="142" cy="195" r="4" fill="#3B82F6"/>
    <rect x="165" y="188" width="140" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="165" y="199" width="85" height="5" rx="2.5" fill="#64748B"/>
    <!-- Badge -->
    <rect x="330" y="186" width="75" height="18" rx="9" fill="#FEF3C7"/>
    <text x="367" y="199" font-family="sans-serif" font-size="9" font-weight="bold" fill="#B45309" text-anchor="middle">IN PROGRESS</text>

    <!-- Task Row 3 (Scheduled) -->
    <rect x="120" y="228" width="300" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="142" cy="249" r="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="165" y="242" width="110" height="7" rx="3.5" fill="#64748B"/>
    <rect x="165" y="253" width="60" height="5" rx="2.5" fill="#94A3B8"/>
    <!-- Badge -->
    <rect x="340" y="240" width="65" height="18" rx="9" fill="#F1F5F9"/>
    <text x="372" y="253" font-family="sans-serif" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle">TODO</text>

    <!-- Progress Bar at bottom of card -->
    <rect x="120" y="290" width="300" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="120" y="290" width="210" height="6" rx="3" fill="url(#blue-btn)"/>
  </g>

  <!-- ================= FLOATING WIDGET 1: MINI CALENDAR (TOP RIGHT) ================= -->
  <g filter="url(#badge-shadow)">
    <rect x="380" y="25" width="125" height="110" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <!-- Header -->
    <rect x="380" y="25" width="125" height="28" rx="16" fill="url(#blue-btn)"/>
    <rect x="380" y="40" width="125" height="13" fill="url(#blue-btn)"/>
    <text x="442" y="44" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SEPTEMBER</text>
    
    <!-- Mini Date Matrix -->
    <circle cx="410" cy="70" r="8" fill="#EFF6FF"/>
    <text x="410" y="74" font-family="sans-serif" font-size="10" fill="#3B82F6" text-anchor="middle">11</text>
    
    <circle cx="442" cy="70" r="10" fill="url(#blue-btn)"/>
    <text x="442" y="74" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">12</text>
    
    <circle cx="474" cy="70" r="8" fill="#EFF6FF"/>
    <text x="474" y="74" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">13</text>

    <!-- Notification pill -->
    <rect x="395" y="94" width="95" height="24" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
    <circle cx="406" cy="106" r="3.5" fill="#10B981"/>
    <text x="448" y="110" font-family="sans-serif" font-size="9" font-weight="bold" fill="#065F46" text-anchor="middle">3 Tasks Today</text>
  </g>

  <!-- ================= FLOATING WIDGET 2: PRODUCTIVITY STATS (BOTTOM LEFT) ================= -->
  <g filter="url(#badge-shadow)">
    <rect x="40" y="240" width="140" height="95" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="70" cy="272" r="16" fill="#EFF6FF"/>
    <path d="M64 272 L68 276 L76 268" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="268" font-family="sans-serif" font-size="18" font-weight="800" fill="#0F172A">94%</text>
    <text x="96" y="282" font-family="sans-serif" font-size="9" font-weight="600" fill="#64748B">Completion</text>
    
    <!-- Star achievement -->
    <rect x="52" y="300" width="116" height="22" rx="6" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="110" y="315" font-family="sans-serif" font-size="9" font-weight="bold" fill="#B45309" text-anchor="middle">⚡ Great Focus!</text>
  </g>

  <!-- Decorative Sparkles / Floating Particles -->
  <polygon points="120,40 123,48 131,51 123,54 120,62 117,54 109,51 117,48" fill="#F59E0B" opacity="0.75"/>
  <polygon points="460,280 462,286 468,288 462,290 460,296 458,290 452,288 458,286" fill="#3B82F6" opacity="0.6"/>
  <circle cx="490" cy="220" r="4" fill="#10B981" opacity="0.6"/>
  <circle cx="70" cy="130" r="5" fill="#6366F1" opacity="0.4"/>
</svg>
